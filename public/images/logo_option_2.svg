<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#000000"/>
  <!-- Glowing subtle ring background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="4" stroke-dasharray="8 8"/>
  <!-- Triangular Fulcrum Base -->
  <polygon points="256,260 210,380 302,380" fill="#ffffff"/>
  <!-- Diverging Path Scale Beam -->
  <path d="M 110 200 C 180 200, 200 240, 256 240 C 312 240, 332 200, 402 200" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- Left Weight Node (Career Path A) -->
  <circle cx="110" cy="200" r="36" fill="#000000" stroke="#ffffff" stroke-width="16"/>
  <circle cx="110" cy="200" r="12" fill="#ffffff"/>
  <!-- Right Weight Node (Career Path B) -->
  <circle cx="402" cy="200" r="36" fill="#000000" stroke="#ffffff" stroke-width="16"/>
  <circle cx="402" cy="200" r="12" fill="#ffffff"/>
</svg>
