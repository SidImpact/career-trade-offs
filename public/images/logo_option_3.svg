<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#09090b"/>
  <g transform="translate(0, 10)">
    <!-- Stylized 'C' and 'T' integrated into a balance beam -->
    <!-- Top Horizontal T Bar / Beam -->
    <line x1="120" y1="160" x2="392" y2="160" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <!-- T Vertical Stem -->
    <line x1="256" y1="160" x2="256" y2="380" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <!-- C Arc on the left -->
    <path d="M 170 230 C 100 230, 90 330, 170 340" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <!-- Right Scale Pan Circle -->
    <circle cx="392" cy="280" r="45" fill="none" stroke="#ffffff" stroke-width="18"/>
    <line x1="392" y1="160" x2="392" y2="235" stroke="#a1a1aa" stroke-width="10"/>
    <line x1="120" y1="160" x2="120" y2="280" stroke="#a1a1aa" stroke-width="10"/>
    <circle cx="120" cy="285" r="12" fill="#ffffff"/>
  </g>
</svg>
