[build.environment]
  # Secrets scanning flags values embedded in the Turbopack build cache (an
  # intermediate artifact, not something served to users). GMAIL_USER /
  # GMAIL_APP_PASSWORD are only read server-side in src/app/api/feedback/route.ts,
  # so excluding this cache path from scanning is safe.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
